services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:-changeme}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - PORT=8080
      - DB_PATH=/app/data/expense-tracker.db
    volumes:
      - ./config.yaml:/app/config.yaml
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app_data:
