plugins {
    id 'com.android.application'
}

android {
    namespace 'com.expensetracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.expensetracker"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Server URL — change this to your actual server IP/hostname
        // For local network: "http://192.168.1.x:8080"
        // For emulator testing: "http://10.0.2.2:8080"
        buildConfigField "String", "SERVER_URL", "\"http://10.0.2.2:8080\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
}
